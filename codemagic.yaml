workflows:
  store-screenshot:
    name: Captura de MindFit para App Store
    instance_type: mac_mini_m2
    max_build_duration: 25
    environment:
      xcode: 27.1
    scripts:
      - name: Capturar la demo en un iPhone con Dynamic Island
        script: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"] in ("iPhone 17", "iPhone 16 Pro", "iPhone 16", "iPhone 15")))')
          xcrun simctl bootstatus "$device" -b
          xcodebuild build -project MindFit.xcodeproj -scheme MindFit -destination "id=$device" -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          xcrun simctl install "$device" build/Build/Products/Debug-iphonesimulator/MindFit.app
          xcrun simctl status_bar "$device" override --time 9:41
          xcrun simctl launch "$device" com.easyfit.mindfit --demo -AppleLanguages '(es)' -AppleLocale es_MX
          sleep 25
          mkdir -p artifacts
          xcrun simctl io "$device" screenshot artifacts/MindFit-demo.png
    artifacts:
      - artifacts/MindFit-demo.png
  duo-simulator:
    name: MindFit - iPhone Duo
    instance_type: mac_mini_m2
    max_build_duration: 35
    environment:
      xcode: 27.1
    scripts:
      - name: Generar el proyecto de Xcode
        script: |
          set -eu
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Compilar y probar la demo en iPhone Duo
        script: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild test -project MindFit.xcodeproj -scheme MindFit -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone Duo,OS=latest' \
            -parallel-testing-enabled NO -resultBundlePath artifacts/Duo.xcresult \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - artifacts/*.xcresult
  internal-testflight:
    name: MindFit - TestFlight interno
    instance_type: mac_mini_m2
    max_build_duration: 35
    integrations:
      app_store_connect: MindFit TestFlight
    environment:
      xcode: 27.1
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.easyfit.mindfit
    scripts:
      - name: Preparar y firmar la versión para iPhone
        script: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$PROJECT_BUILD_NUMBER\"/" project.yml
          xcodegen generate
          xcode-project use-profiles
          xcode-project build-ipa --project MindFit.xcodeproj --scheme MindFit
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
